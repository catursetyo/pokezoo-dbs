{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <div class="w-64 bg-indigo-800 text-white flex flex-col">
        <div class="flex items-center justify-center h-16 border-b border-indigo-700">
            <span class="text-xl font-bold uppercase tracking-wider">Visitor Portal</span>
        </div>
        <div class="flex-1 overflow-y-auto">
            <nav class="mt-4 px-2 space-y-1">
                <a href="/visitor/dashboard" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-indigo-700">My Dashboard</a>
                <a href="/visitor/explore" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-indigo-700">Explore Zoo</a>
                <a href="/visitor/tickets/buy" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-indigo-700">Buy Tickets</a>
                <a href="/visitor/reviews" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-indigo-700">Leave a Review</a>
            </nav>
        </div>
        <div class="p-4 border-t border-indigo-700">
            <a href="/auth/logout" class="block w-full text-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-hidden flex flex-col">
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <h1 class="text-2xl font-bold leading-tight text-gray-900">{% block header_title %}Welcome{% endblock %}</h1>
            </div>
        </header>
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            {% block visitor_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
