{% extends "keeper/layout.html" %}
{% block title %}Behavior Logs - PokeZOO Keeper{% endblock %}
{% block header_title %}Log Pokémon Behavior{% endblock %}
{% block keeper_content %}
<div class="bg-white rounded-lg shadow overflow-hidden max-w-2xl mx-auto">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-bold">New Behavior Log</h3>
        <p class="text-sm text-gray-500">Records will be stored securely in the MongoDB behavior_logs collection.</p>
    </div>
    <div class="p-6">
        <form action="/keeper/logs" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-sm font-medium text-gray-700">Select Pokémon</label>
                <select name="pokemon_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-white">
                    {% for p in assigned_pokemon %}
                    <option value="{{ p.pokemon_id }}">{{ p.nickname }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Observed Behavior</label>
                <input type="text" name="behavior" placeholder="e.g. Sleeping peacefully" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mood</label>
                <select name="mood" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 bg-white">
                    <option value="calm">Calm</option>
                    <option value="happy">Happy</option>
                    <option value="agitated">Agitated</option>
                    <option value="lethargic">Lethargic</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Trigger (Optional)</label>
                <input type="text" name="trigger_reason" placeholder="e.g. Loud noises, Feeding time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
            </div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-medium text-gray-700">Dynamic Fields (Optional)</label>
                    <button type="button" onclick="addDynamicField()" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-200">+ Add Field</button>
                </div>
                <div id="dynamicFieldsContainer" class="space-y-2">
                    <!-- Dynamic fields will be added here -->
                </div>
            </div>
            <div class="pt-4">
                <button type="submit" class="w-full bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 font-bold">Submit Log</button>
            </div>
        </form>
    </div>
</div>
<script>
    function addDynamicField() {
        const container = document.getElementById('dynamicFieldsContainer');
        const row = document.createElement('div');
        row.className = 'flex space-x-2 items-center';
        row.innerHTML = `
            <input type="text" name="custom_keys" placeholder="Key (e.g. Weather)" required class="flex-1 w-1/3 rounded-md border-gray-300 shadow-sm border p-2 text-sm">
            <input type="text" name="custom_values" placeholder="Value (e.g. Sunny)" required class="flex-1 w-2/3 rounded-md border-gray-300 shadow-sm border p-2 text-sm">
            <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            </button>
        `;
        container.appendChild(row);
    }
</script>
{% endblock %}
