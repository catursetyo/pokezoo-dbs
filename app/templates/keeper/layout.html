{% extends "base.html" %}
{% block content %}
<div class="flex h-screen bg-gray-100">
    <div class="w-64 bg-green-800 text-white flex flex-col">
        <div class="flex items-center justify-center h-16 border-b border-green-700">
            <span class="text-xl font-bold uppercase tracking-wider">Keeper Portal</span>
        </div>
        <div class="flex-1 overflow-y-auto">
            <nav class="mt-4 px-2 space-y-1">
                <a href="/keeper/dashboard" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-green-700">Dashboard</a>
                <a href="/keeper/logs" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-green-700">Behavior Logs</a>
                <a href="/keeper/incidents" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md hover:bg-green-700">Incident Reports</a>
            </nav>
        </div>
        <div class="p-4 border-t border-green-700">
            <a href="/auth/logout" class="block w-full text-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700">Logout</a>
        </div>
    </div>
    <div class="flex-1 overflow-hidden">
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
                <h1 class="text-2xl font-bold leading-tight text-gray-900">{% block header_title %}Keeper Dashboard{% endblock %}</h1>
            </div>
        </header>
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            {% block keeper_content %}{% endblock %}
        </main>
    </div>
</div>
{% endblock %}
